events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow massive file uploads (up to 100GB) without 413 Entity Too Large
    client_max_body_size 100G;
    client_body_timeout 3600s;
    send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    upstream nextcloud_backend {
        server 10.147.17.1:7580;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Nextcloud Backend Proxy (WebDAV, Public Shares, OCS, OnlyOffice) ──
        location ~ ^/(remote\.php|public\.php|ocs|ocs-provider|index\.php|apps|core|dist|custom_apps|s/|status\.php|cron\.php|themes) {
            proxy_pass http://nextcloud_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_request_buffering off;
            proxy_buffering off;

            # Allow embedding OnlyOffice & Nextcloud preview
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # ── Static Assets Caching ──
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Frontend SPA Routing ──
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
