events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow massive file uploads (up to 100GB) without 413 Entity Too Large
    client_max_body_size 100G;
    client_body_timeout 3600s;
    send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    upstream nextcloud_backend {
        server 10.147.17.1:7580;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Frontend SPA Routing ──
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ── Static Assets Caching ──
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Nextcloud WebDAV & SabreDAV API ──
        location /remote.php {
            proxy_pass http://nextcloud_backend;
            proxy_set_header Host 10.147.17.1:7580;
            proxy_set_header X-Forwarded-Host 10.147.17.1:7580;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header OCS-APIRequest "true";
            proxy_set_header X-Requested-With "XMLHttpRequest";
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # ── Nextcloud OCS API (Sharing, Activity, User Provisioning) ──
        location /ocs {
            proxy_pass http://nextcloud_backend;
            proxy_set_header Host 10.147.17.1:7580;
            proxy_set_header X-Forwarded-Host 10.147.17.1:7580;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header OCS-APIRequest "true";
            proxy_set_header X-Requested-With "XMLHttpRequest";
        }

        # ── Nextcloud Public Shares ──
        location /s/ {
            proxy_pass http://nextcloud_backend;
            proxy_set_header Host 10.147.17.1:7580;
            proxy_set_header X-Forwarded-Host 10.147.17.1:7580;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Nextcloud Core / Apps / Avatars ──
        location ~ ^/(apps|core|dist|custom_apps|index.php/avatar)/ {
            proxy_pass http://nextcloud_backend;
            proxy_set_header Host 10.147.17.1:7580;
            proxy_set_header X-Forwarded-Host 10.147.17.1:7580;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── OnlyOffice & Nextcloud Iframe Embed Support ──
        location /index.php {
            proxy_pass http://nextcloud_backend;
            proxy_set_header Host 10.147.17.1:7580;
            proxy_set_header X-Forwarded-Host 10.147.17.1:7580;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Remove frame-blocking headers to allow embedding OnlyOffice docs seamlessly
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }
    }
}
