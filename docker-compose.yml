version: '3.8'

services:
  govind-drive:
    image: nginx:alpine
    container_name: govind-drive-web
    restart: unless-stopped
    ports:
      - "8765:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
